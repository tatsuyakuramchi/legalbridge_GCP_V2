substitutions:
  _REGION: asia-northeast1
  _SERVICE: legalbridge-v2-preview
  _AR_REPOSITORY: legalbridge
  _IMAGE: legalbridge-v2
  _CLOUD_SQL_INSTANCE: legalbridge-488506:asia-northeast1:legalbridge-db
  _DB_NAME: legalbridge
  _DB_USER: legalbridge_v2_readonly
  _DB_PASSWORD_SECRET: legalbridge-v2-readonly-db-password
  _SERVICE_ACCOUNT: legalbridge-v2-preview@legalbridge-488506.iam.gserviceaccount.com

steps:
  - id: test
    name: node:22
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npm run typecheck
        npm test
        npm run build

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run deploy "${_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${SHORT_SHA}" \
          --region="${_REGION}" \
          --platform=managed \
          --no-allow-unauthenticated \
          --service-account="${_SERVICE_ACCOUNT}" \
          --add-cloudsql-instances="${_CLOUD_SQL_INSTANCE}" \
          --set-secrets="DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest" \
          --set-env-vars="NODE_ENV=production,INTEGRATION_MODE=local,DB_ACCESS_MODE=readonly,REQUIRE_DATABASE=true,DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE},DB_PORT=5432,DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},DB_POOL_MAX=5"

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY
