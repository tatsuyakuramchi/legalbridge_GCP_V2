substitutions:
  _REGION: asia-northeast1
  _SERVICE: legalbridge-v2-write-test
  _AR_REPOSITORY: legalbridge
  _IMAGE: legalbridge-v2-write-test
  _CLOUD_SQL_INSTANCE: legalbridge-488506:asia-northeast1:legalbridge-db
  _DB_NAME: legalbridge_v2_validation
  _DB_USER: legalbridge_v2_validation_writer
  _DB_PASSWORD_SECRET: legalbridge-v2-validation-writer-db-password
  _SERVICE_ACCOUNT: legalbridge-v2-preview@legalbridge-488506.iam.gserviceaccount.com
  _CONFIRM_ISOLATED_DB: BLOCKED
  _CONFIRM_DOCUMENT_TABLES: BLOCKED
  _AUTH_MODE: disabled
  _AUTH_ADMIN_EMAILS: BLOCKED
  _AUTH_LEGAL_EMAILS: BLOCKED
  _AUTH_REQUESTER_DOMAINS: BLOCKED
  _CONFIRM_IAP_BACKEND: BLOCKED
  _SLACK_NOTIFICATION_HISTORY_ENABLED: "false"
  _SLACK_NOTIFICATION_APPROVALS_ENABLED: "false"
  _SLACK_APPROVAL_WRITES_ENABLED: "false"
  _WRITE_SCOPES: drafts,documents,pdf
  _CONFIRM_SLACK_APPROVAL_WRITES: BLOCKED
  _SLACK_DRY_RUN_USER_MAP: UNRESOLVED
  _SLACK_DELIVERY_MODE: disabled
  _BACKLOG_MODE: disabled
  _BACKLOG_HOST: BLOCKED
  _BACKLOG_PROJECT_KEY: BLOCKED
  _BACKLOG_API_KEY_SECRET: backlog-api-key
  _CONFIRM_BACKLOG_READONLY: BLOCKED
  _OUTBOUND_CONDITION_WRITES_ENABLED: "false"
  _OUTBOUND_DB_NAME: BLOCKED
  _OUTBOUND_DB_USER: BLOCKED
  _OUTBOUND_DB_PASSWORD_SECRET: legalbridge-v2-outbound-db-password
  _CONFIRM_OUTBOUND_WRITES: BLOCKED

steps:
  - id: test
    name: node:22
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npm run typecheck
        npm test
        npm run build

  - id: verify-isolation
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test "${_SERVICE}" != "legalbridge-v2-preview"
        test "${_DB_NAME}" != "legalbridge"
        test "${_DB_USER}" != "legalbridge"
        if [ "${_CONFIRM_ISOLATED_DB}" != "ISOLATED_DRAFT_TEST" ]; then
          echo "Write-test deployment blocked: isolated DB confirmation is missing."
          exit 1
        fi
        if [ "${_CONFIRM_DOCUMENT_TABLES}" != "EMPTY_DOCUMENT_TABLES_CONFIRMED" ]; then
          echo "Document finalization deployment blocked: empty validation tables are not confirmed."
          exit 1
        fi
        case "${_AUTH_MODE}" in
          disabled)
            ;;
          iap)
            if [ "${_CONFIRM_IAP_BACKEND}" != "IAP_BACKEND_READY" ]; then
              echo "IAP deployment blocked: backend readiness confirmation is missing."
              exit 1
            fi
            for value in "${_AUTH_ADMIN_EMAILS}" "${_AUTH_LEGAL_EMAILS}" "${_AUTH_REQUESTER_DOMAINS}"; do
              if [ -z "$$value" ] || [ "$$value" = "BLOCKED" ]; then
                echo "IAP deployment blocked: role configuration is missing."
                exit 1
              fi
            done
            ;;
          *)
            echo "Deployment blocked: AUTH_MODE must be disabled or iap."
            exit 1
            ;;
        esac
        case "${_BACKLOG_MODE}" in
          disabled)
            ;;
          readonly)
            if [ "${_CONFIRM_BACKLOG_READONLY}" != "BACKLOG_READONLY_VALIDATION_ONLY" ]; then
              echo "Backlog deployment blocked: explicit read-only validation confirmation is missing."
              exit 1
            fi
            if [ "${_SERVICE}" != "legalbridge-v2-write-test" ] || [ "${_BACKLOG_HOST}" != "arclight.backlog.com" ] || [ "${_BACKLOG_PROJECT_KEY}" != "LEGAL" ]; then
              echo "Backlog deployment blocked: validation service, host, or project does not match the approved target."
              exit 1
            fi
            ;;
          live)
            echo "Backlog live writes remain blocked while the existing worker is authoritative."
            exit 1
            ;;
          *)
            echo "Deployment blocked: BACKLOG_MODE must be disabled or readonly."
            exit 1
            ;;
        esac
        case "${_SLACK_DELIVERY_MODE}" in
          disabled)
            ;;
          live)
            echo "Slack live delivery is not enabled by this deployment foundation."
            exit 1
            ;;
          *)
            echo "Deployment blocked: SLACK_DELIVERY_MODE must be disabled or live."
            exit 1
            ;;
        esac
        case "${_OUTBOUND_CONDITION_WRITES_ENABLED}" in
          false)
            ;;
          true)
            if [ "${_CONFIRM_OUTBOUND_WRITES}" != "OUTBOUND_WRITES_LEGALBRIDGE_VALIDATION_ONLY" ]; then
              echo "Outbound deployment blocked: explicit production-schema validation confirmation is missing."
              exit 1
            fi
            if [ "${_SERVICE}" != "legalbridge-v2-write-test" ] || [ "${_OUTBOUND_DB_NAME}" != "legalbridge" ] || [ "${_OUTBOUND_DB_USER}" != "legalbridge_v2_outbound_writer" ]; then
              echo "Outbound deployment blocked: service, database, or dedicated user does not match the approved target."
              exit 1
            fi
            if [ "${_AUTH_MODE}" != "iap" ]; then
              echo "Outbound deployment blocked: IAP authentication is required."
              exit 1
            fi
            ;;
          *)
            echo "Deployment blocked: OUTBOUND_CONDITION_WRITES_ENABLED must be true or false."
            exit 1
            ;;
        esac
        case "${_SLACK_APPROVAL_WRITES_ENABLED}" in
          false)
            ;;
          true)
            if [ "${_CONFIRM_SLACK_APPROVAL_WRITES}" != "SLACK_APPROVAL_WRITES_VALIDATION_ONLY" ]; then
              echo "Slack approval deployment blocked: explicit validation-only confirmation is missing."
              exit 1
            fi
            if [ "${_SERVICE}" != "legalbridge-v2-write-test" ] || [ "${_DB_NAME}" != "legalbridge_v2_validation" ]; then
              echo "Slack approval deployment blocked: target is not the isolated validation environment."
              exit 1
            fi
            if [ "${_AUTH_MODE}" != "iap" ]; then
              echo "Slack approval deployment blocked: IAP authentication is required."
              exit 1
            fi
            if [ "${_SLACK_NOTIFICATION_HISTORY_ENABLED}" != "true" ] || [ "${_SLACK_NOTIFICATION_APPROVALS_ENABLED}" != "true" ]; then
              echo "Slack approval deployment blocked: history and approval repositories must both be enabled."
              exit 1
            fi
            if [ -z "${_SLACK_DRY_RUN_USER_MAP}" ] || [ "${_SLACK_DRY_RUN_USER_MAP}" = "UNRESOLVED" ]; then
              echo "Slack approval deployment blocked: an explicit dry-run recipient map is required."
              exit 1
            fi
            ;;
          *)
            echo "Deployment blocked: SLACK_APPROVAL_WRITES_ENABLED must be true or false."
            exit 1
            ;;
        esac
        expected_write_scopes="drafts,documents,pdf"
        if [ "${_SLACK_APPROVAL_WRITES_ENABLED}" = "true" ]; then
          expected_write_scopes="$$expected_write_scopes,slack-approvals"
        fi
        if [ "${_OUTBOUND_CONDITION_WRITES_ENABLED}" = "true" ]; then
          expected_write_scopes="$$expected_write_scopes,outbound-conditions"
        fi
        if [ "${_WRITE_SCOPES}" != "$$expected_write_scopes" ]; then
          echo "Deployment blocked: WRITE_SCOPES does not exactly match the enabled guarded capabilities."
          exit 1
        fi

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run deploy "${_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}" \
          --region="${_REGION}" \
          --platform=managed \
          --memory=1Gi \
          --cpu=1 \
          --concurrency=2 \
          --no-allow-unauthenticated \
          --service-account="${_SERVICE_ACCOUNT}" \
          --add-cloudsql-instances="${_CLOUD_SQL_INSTANCE}" \
          --set-secrets="DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,BACKLOG_API_KEY=${_BACKLOG_API_KEY_SECRET}:latest,OUTBOUND_DB_PASSWORD=${_OUTBOUND_DB_PASSWORD_SECRET}:latest" \
          --set-env-vars="^~^NODE_ENV=production~AUTH_MODE=${_AUTH_MODE}~AUTH_ADMIN_EMAILS=${_AUTH_ADMIN_EMAILS}~AUTH_LEGAL_EMAILS=${_AUTH_LEGAL_EMAILS}~AUTH_REQUESTER_DOMAINS=${_AUTH_REQUESTER_DOMAINS}~INTEGRATION_MODE=local~SLACK_DELIVERY_MODE=${_SLACK_DELIVERY_MODE}~BACKLOG_MODE=${_BACKLOG_MODE}~BACKLOG_HOST=${_BACKLOG_HOST}~BACKLOG_PROJECT_KEY=${_BACKLOG_PROJECT_KEY}~SLACK_NOTIFICATION_HISTORY_ENABLED=${_SLACK_NOTIFICATION_HISTORY_ENABLED}~SLACK_NOTIFICATION_APPROVALS_ENABLED=${_SLACK_NOTIFICATION_APPROVALS_ENABLED}~SLACK_DRY_RUN_USER_MAP=${_SLACK_DRY_RUN_USER_MAP}~DB_ACCESS_MODE=readwrite~REQUIRE_DATABASE=true~WRITE_FEATURES_ENABLED=true~WRITE_SCOPES=${_WRITE_SCOPES}~DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE}~DB_PORT=5432~DB_NAME=${_DB_NAME}~DB_USER=${_DB_USER}~DB_POOL_MAX=3~OUTBOUND_CONDITION_WRITES_ENABLED=${_OUTBOUND_CONDITION_WRITES_ENABLED}~OUTBOUND_DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE}~OUTBOUND_DB_PORT=5432~OUTBOUND_DB_NAME=${_OUTBOUND_DB_NAME}~OUTBOUND_DB_USER=${_OUTBOUND_DB_USER}"

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY
