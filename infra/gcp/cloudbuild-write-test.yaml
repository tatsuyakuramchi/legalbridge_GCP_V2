substitutions:
  _REGION: asia-northeast1
  _SERVICE: legalbridge-v2-write-test
  _AR_REPOSITORY: legalbridge
  _IMAGE: legalbridge-v2-write-test
  _CLOUD_SQL_INSTANCE: legalbridge-488506:asia-northeast1:legalbridge-db
  _DB_NAME: legalbridge_v2_validation
  _DB_USER: legalbridge_v2_validation_writer
  _DB_PASSWORD_SECRET: legalbridge-v2-validation-writer-db-password
  _SERVICE_ACCOUNT: legalbridge-v2-preview@legalbridge-488506.iam.gserviceaccount.com
  _PRIMARY_DB_MODE: validation
  _CONFIRM_ISOLATED_DB: BLOCKED
  _CONFIRM_PRODUCTION_PRIMARY: BLOCKED
  _CONFIRM_DOCUMENT_TABLES: BLOCKED
  _AUTH_MODE: disabled
  _AUTH_ADMIN_EMAILS: BLOCKED
  _AUTH_LEGAL_EMAILS: BLOCKED
  _AUTH_REQUESTER_DOMAINS: BLOCKED
  _CONFIRM_IAP_BACKEND: BLOCKED
  _CONFIRM_CLOUDRUN_IAM: BLOCKED
  _SLACK_NOTIFICATION_HISTORY_ENABLED: "false"
  _SLACK_NOTIFICATION_APPROVALS_ENABLED: "false"
  _SLACK_APPROVAL_WRITES_ENABLED: "false"
  _WRITE_SCOPES: drafts,documents,pdf
  _CONFIRM_SLACK_APPROVAL_WRITES: BLOCKED
  _SLACK_DRY_RUN_USER_MAP: UNRESOLVED
  _SLACK_DELIVERY_MODE: disabled
  _BACKLOG_MODE: disabled
  _BACKLOG_HOST: BLOCKED
  _BACKLOG_PROJECT_KEY: BLOCKED
  _BACKLOG_API_KEY_SECRET: backlog-api-key
  _CONFIRM_BACKLOG_READONLY: BLOCKED
  _OUTBOUND_CONDITION_WRITES_ENABLED: "false"
  _OUTBOUND_DB_NAME: BLOCKED
  _OUTBOUND_DB_USER: BLOCKED
  _OUTBOUND_DB_PASSWORD_SECRET: legalbridge-v2-outbound-db-password
  _CONFIRM_OUTBOUND_WRITES: BLOCKED
  _CONTRACT_INTAKE_WRITES_ENABLED: "false"
  _CONFIRM_CONTRACT_INTAKE_WRITES: BLOCKED
  _DRIVE_STORAGE_ENABLED: "false"
  _CONFIRM_DRIVE_STORAGE: BLOCKED
  _GOOGLE_DRIVE_FOLDER_ID: BLOCKED
  _GWS_SA_KEY_SECRET: BLOCKED
  _DRIVE_ENVIRONMENT_TAG: validation

steps:
  - id: test
    name: node:22
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npm run typecheck
        npm test
        npm run build

  - id: verify-isolation
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test "${_SERVICE}" != "legalbridge-v2-preview"
        case "${_PRIMARY_DB_MODE}" in
          validation)
            test "${_DB_NAME}" != "legalbridge"
            test "${_DB_USER}" != "legalbridge"
            if [ "${_CONFIRM_ISOLATED_DB}" != "ISOLATED_DRAFT_TEST" ]; then
              echo "Write-test deployment blocked: isolated DB confirmation is missing."
              exit 1
            fi
            if [ "${_CONFIRM_DOCUMENT_TABLES}" != "EMPTY_DOCUMENT_TABLES_CONFIRMED" ]; then
              echo "Document finalization deployment blocked: empty validation tables are not confirmed."
              exit 1
            fi
            ;;
          production)
            if [ "${_CONFIRM_PRODUCTION_PRIMARY}" != "CUTOVER_V2_PRIMARY_TO_LEGALBRIDGE" ]; then
              echo "Production primary deployment blocked: explicit cutover confirmation is missing."
              exit 1
            fi
            if [ "${_SERVICE}" != "legalbridge-v2-write-test" ] || [ "${_DB_NAME}" != "legalbridge" ] || [ "${_DB_USER}" != "legalbridge_v2_runtime" ] || [ "${_DB_PASSWORD_SECRET}" != "legalbridge-v2-runtime-db-password" ]; then
              echo "Production primary deployment blocked: service, database, runtime user, or password secret does not match the approved target."
              exit 1
            fi
            if [ "${_CONFIRM_DOCUMENT_TABLES}" != "PRODUCTION_DOCUMENT_TABLES_PREFLIGHT_CONFIRMED" ]; then
              echo "Production primary deployment blocked: production document-table preflight is not confirmed."
              exit 1
            fi
            if [ "${_AUTH_MODE}" = "disabled" ]; then
              echo "Production primary deployment blocked: upstream authentication is required."
              exit 1
            fi
            ;;
          *)
            echo "Deployment blocked: PRIMARY_DB_MODE must be validation or production."
            exit 1
            ;;
        esac
        case "${_AUTH_MODE}" in
          disabled)
            ;;
          cloudrun-iam)
            if [ "${_CONFIRM_CLOUDRUN_IAM}" != "CLOUDRUN_IAM_PROXY_VALIDATION_ONLY" ]; then
              echo "Cloud Run IAM deployment blocked: explicit proxy-validation confirmation is missing."
              exit 1
            fi
            if [ "${_SERVICE}" != "legalbridge-v2-write-test" ] || [ "${_AUTH_ADMIN_EMAILS}" != "tatsuya.kuramochi@arclight.co.jp" ]; then
              echo "Cloud Run IAM deployment blocked: service or sole administrator does not match the approved validation target."
              exit 1
            fi
            ;;
          iap)
            if [ "${_CONFIRM_IAP_BACKEND}" != "IAP_BACKEND_READY" ]; then
              echo "IAP deployment blocked: backend readiness confirmation is missing."
              exit 1
            fi
            for value in "${_AUTH_ADMIN_EMAILS}" "${_AUTH_LEGAL_EMAILS}" "${_AUTH_REQUESTER_DOMAINS}"; do
              if [ -z "$$value" ] || [ "$$value" = "BLOCKED" ]; then
                echo "IAP deployment blocked: role configuration is missing."
                exit 1
              fi
            done
            ;;
          *)
            echo "Deployment blocked: AUTH_MODE must be disabled, cloudrun-iam, or iap."
            exit 1
            ;;
        esac
        case "${_BACKLOG_MODE}" in
          disabled)
            ;;
          readonly)
            if [ "${_CONFIRM_BACKLOG_READONLY}" != "BACKLOG_READONLY_VALIDATION_ONLY" ]; then
              echo "Backlog deployment blocked: explicit read-only validation confirmation is missing."
              exit 1
            fi
            if [ "${_SERVICE}" != "legalbridge-v2-write-test" ] || [ "${_BACKLOG_HOST}" != "arclight.backlog.com" ] || [ "${_BACKLOG_PROJECT_KEY}" != "LEGAL" ]; then
              echo "Backlog deployment blocked: validation service, host, or project does not match the approved target."
              exit 1
            fi
            ;;
          live)
            echo "Backlog live writes remain blocked while the existing worker is authoritative."
            exit 1
            ;;
          *)
            echo "Deployment blocked: BACKLOG_MODE must be disabled or readonly."
            exit 1
            ;;
        esac
        case "${_SLACK_DELIVERY_MODE}" in
          disabled)
            ;;
          live)
            echo "Slack live delivery is not enabled by this deployment foundation."
            exit 1
            ;;
          *)
            echo "Deployment blocked: SLACK_DELIVERY_MODE must be disabled or live."
            exit 1
            ;;
        esac
        case "${_OUTBOUND_CONDITION_WRITES_ENABLED}" in
          false)
            ;;
          true)
            if [ "${_CONFIRM_OUTBOUND_WRITES}" != "OUTBOUND_WRITES_LEGALBRIDGE_VALIDATION_ONLY" ]; then
              echo "Outbound deployment blocked: explicit production-schema validation confirmation is missing."
              exit 1
            fi
            expected_outbound_user="legalbridge_v2_outbound_writer"
            expected_outbound_secret="legalbridge-v2-outbound-db-password"
            if [ "${_PRIMARY_DB_MODE}" = "production" ]; then
              expected_outbound_user="legalbridge_v2_runtime"
              expected_outbound_secret="legalbridge-v2-runtime-db-password"
            fi
            if [ "${_SERVICE}" != "legalbridge-v2-write-test" ] || [ "${_OUTBOUND_DB_NAME}" != "legalbridge" ] || [ "${_OUTBOUND_DB_USER}" != "$$expected_outbound_user" ] || [ "${_OUTBOUND_DB_PASSWORD_SECRET}" != "$$expected_outbound_secret" ]; then
              echo "Outbound deployment blocked: service, database, dedicated user, or password secret does not match the approved target."
              exit 1
            fi
            if [ "${_AUTH_MODE}" != "iap" ] && [ "${_AUTH_MODE}" != "cloudrun-iam" ]; then
              echo "Outbound deployment blocked: IAP or Cloud Run IAM authentication is required."
              exit 1
            fi
            ;;
          *)
            echo "Deployment blocked: OUTBOUND_CONDITION_WRITES_ENABLED must be true or false."
            exit 1
            ;;
        esac
        case "${_CONTRACT_INTAKE_WRITES_ENABLED}" in
          false)
            ;;
          true)
            if [ "${_CONFIRM_CONTRACT_INTAKE_WRITES}" != "CONTRACT_INTAKE_LEGALBRIDGE_VALIDATION_ONLY" ]; then
              echo "Contract intake deployment blocked: explicit production validation confirmation is missing."
              exit 1
            fi
            if [ "${_PRIMARY_DB_MODE}" != "production" ] || [ "${_SERVICE}" != "legalbridge-v2-write-test" ] || [ "${_DB_NAME}" != "legalbridge" ] || [ "${_DB_USER}" != "legalbridge_v2_runtime" ] || [ "${_DB_PASSWORD_SECRET}" != "legalbridge-v2-runtime-db-password" ]; then
              echo "Contract intake deployment blocked: service, database, runtime user, or password secret does not match the approved target."
              exit 1
            fi
            if [ "${_AUTH_MODE}" != "iap" ] && [ "${_AUTH_MODE}" != "cloudrun-iam" ]; then
              echo "Contract intake deployment blocked: IAP or Cloud Run IAM authentication is required."
              exit 1
            fi
            ;;
          *)
            echo "Deployment blocked: CONTRACT_INTAKE_WRITES_ENABLED must be true or false."
            exit 1
            ;;
        esac
        case "${_SLACK_APPROVAL_WRITES_ENABLED}" in
          false)
            ;;
          true)
            if [ "${_CONFIRM_SLACK_APPROVAL_WRITES}" != "SLACK_APPROVAL_WRITES_VALIDATION_ONLY" ]; then
              echo "Slack approval deployment blocked: explicit validation-only confirmation is missing."
              exit 1
            fi
            if [ "${_SERVICE}" != "legalbridge-v2-write-test" ] || [ "${_DB_NAME}" != "legalbridge_v2_validation" ]; then
              echo "Slack approval deployment blocked: target is not the isolated validation environment."
              exit 1
            fi
            if [ "${_AUTH_MODE}" != "iap" ] && [ "${_AUTH_MODE}" != "cloudrun-iam" ]; then
              echo "Slack approval deployment blocked: IAP or Cloud Run IAM authentication is required."
              exit 1
            fi
            if [ "${_SLACK_NOTIFICATION_HISTORY_ENABLED}" != "true" ] || [ "${_SLACK_NOTIFICATION_APPROVALS_ENABLED}" != "true" ]; then
              echo "Slack approval deployment blocked: history and approval repositories must both be enabled."
              exit 1
            fi
            if [ -z "${_SLACK_DRY_RUN_USER_MAP}" ] || [ "${_SLACK_DRY_RUN_USER_MAP}" = "UNRESOLVED" ]; then
              echo "Slack approval deployment blocked: an explicit dry-run recipient map is required."
              exit 1
            fi
            ;;
          *)
            echo "Deployment blocked: SLACK_APPROVAL_WRITES_ENABLED must be true or false."
            exit 1
            ;;
        esac
        case "${_DRIVE_STORAGE_ENABLED}" in
          false)
            ;;
          true)
            if [ "${_CONFIRM_DRIVE_STORAGE}" != "DRIVE_LEGALBRIDGE_VALIDATION_ONLY" ]; then
              echo "Drive deployment blocked: explicit validation confirmation is missing."
              exit 1
            fi
            if [ "${_SERVICE}" != "legalbridge-v2-write-test" ] || [ "${_GOOGLE_DRIVE_FOLDER_ID}" = "BLOCKED" ] || [ -z "${_GOOGLE_DRIVE_FOLDER_ID}" ] || [ "${_GWS_SA_KEY_SECRET}" = "BLOCKED" ] || [ -z "${_GWS_SA_KEY_SECRET}" ]; then
              echo "Drive deployment blocked: service, Shared Drive folder, or Workspace SA key secret is not set."
              exit 1
            fi
            if [ "${_AUTH_MODE}" != "iap" ] && [ "${_AUTH_MODE}" != "cloudrun-iam" ]; then
              echo "Drive deployment blocked: IAP or Cloud Run IAM authentication is required."
              exit 1
            fi
            ;;
          *)
            echo "Deployment blocked: DRIVE_STORAGE_ENABLED must be true or false."
            exit 1
            ;;
        esac
        expected_write_scopes="drafts,documents,pdf"
        if [ "${_DRIVE_STORAGE_ENABLED}" = "true" ]; then
          expected_write_scopes="$$expected_write_scopes,drive"
        fi
        if [ "${_SLACK_APPROVAL_WRITES_ENABLED}" = "true" ]; then
          expected_write_scopes="$$expected_write_scopes,slack-approvals"
        fi
        if [ "${_OUTBOUND_CONDITION_WRITES_ENABLED}" = "true" ]; then
          expected_write_scopes="$$expected_write_scopes,outbound-conditions"
        fi
        if [ "${_CONTRACT_INTAKE_WRITES_ENABLED}" = "true" ]; then
          expected_write_scopes="$$expected_write_scopes,contract-intake"
        fi
        if [ "${_WRITE_SCOPES}" != "$$expected_write_scopes" ]; then
          echo "Deployment blocked: WRITE_SCOPES does not exactly match the enabled guarded capabilities."
          exit 1
        fi

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        SECRETS="DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,BACKLOG_API_KEY=${_BACKLOG_API_KEY_SECRET}:latest,OUTBOUND_DB_PASSWORD=${_OUTBOUND_DB_PASSWORD_SECRET}:latest"
        ENVVARS="^~^NODE_ENV=production~AUTH_MODE=${_AUTH_MODE}~AUTH_ADMIN_EMAILS=${_AUTH_ADMIN_EMAILS}~AUTH_LEGAL_EMAILS=${_AUTH_LEGAL_EMAILS}~AUTH_REQUESTER_DOMAINS=${_AUTH_REQUESTER_DOMAINS}~INTEGRATION_MODE=local~SLACK_DELIVERY_MODE=${_SLACK_DELIVERY_MODE}~BACKLOG_MODE=${_BACKLOG_MODE}~BACKLOG_HOST=${_BACKLOG_HOST}~BACKLOG_PROJECT_KEY=${_BACKLOG_PROJECT_KEY}~SLACK_NOTIFICATION_HISTORY_ENABLED=${_SLACK_NOTIFICATION_HISTORY_ENABLED}~SLACK_NOTIFICATION_APPROVALS_ENABLED=${_SLACK_NOTIFICATION_APPROVALS_ENABLED}~SLACK_DRY_RUN_USER_MAP=${_SLACK_DRY_RUN_USER_MAP}~DB_ACCESS_MODE=readwrite~REQUIRE_DATABASE=true~WRITE_FEATURES_ENABLED=true~WRITE_SCOPES=${_WRITE_SCOPES}~DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE}~DB_PORT=5432~DB_NAME=${_DB_NAME}~DB_USER=${_DB_USER}~DB_POOL_MAX=3~CONTRACT_INTAKE_WRITES_ENABLED=${_CONTRACT_INTAKE_WRITES_ENABLED}~OUTBOUND_CONDITION_WRITES_ENABLED=${_OUTBOUND_CONDITION_WRITES_ENABLED}~OUTBOUND_DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE}~OUTBOUND_DB_PORT=5432~OUTBOUND_DB_NAME=${_OUTBOUND_DB_NAME}~OUTBOUND_DB_USER=${_OUTBOUND_DB_USER}"
        if [ "${_DRIVE_STORAGE_ENABLED}" = "true" ]; then
          SECRETS="$$SECRETS,/secrets/gws-service-account.json=${_GWS_SA_KEY_SECRET}:latest"
          ENVVARS="$$ENVVARS~GOOGLE_DRIVE_FOLDER_ID=${_GOOGLE_DRIVE_FOLDER_ID}~GOOGLE_SERVICE_ACCOUNT_KEY_PATH=/secrets/gws-service-account.json~DRIVE_ENVIRONMENT_TAG=${_DRIVE_ENVIRONMENT_TAG}"
        fi
        gcloud run deploy "${_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}" \
          --region="${_REGION}" \
          --platform=managed \
          --memory=1Gi \
          --cpu=1 \
          --concurrency=2 \
          --no-allow-unauthenticated \
          --service-account="${_SERVICE_ACCOUNT}" \
          --add-cloudsql-instances="${_CLOUD_SQL_INSTANCE}" \
          --set-secrets="$$SECRETS" \
          --set-env-vars="$$ENVVARS"

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY
