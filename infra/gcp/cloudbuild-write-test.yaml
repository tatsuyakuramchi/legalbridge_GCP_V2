  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        SECRETS="DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,BACKLOG_API_KEY=${_BACKLOG_API_KEY_SECRET}:latest,OUTBOUND_DB_PASSWORD=${_OUTBOUND_DB_PASSWORD_SECRET}:latest"
        ENVVARS="^~^NODE_ENV=production~AUTH_MODE=${_AUTH_MODE}~AUTH_ADMIN_EMAILS=${_AUTH_ADMIN_EMAILS}~AUTH_LEGAL_EMAILS=${_AUTH_LEGAL_EMAILS}~AUTH_REQUESTER_DOMAINS=${_AUTH_REQUESTER_DOMAINS}~INTEGRATION_MODE=${_INTEGRATION_MODE}~SLACK_DELIVERY_MODE=${_SLACK_DELIVERY_MODE}~BACKLOG_MODE=${_BACKLOG_MODE}~BACKLOG_HOST=${_BACKLOG_HOST}~BACKLOG_PROJECT_KEY=${_BACKLOG_PROJECT_KEY}~BACKLOG_COMMENT_WRITE_ENABLED=${_BACKLOG_COMMENT_WRITE_ENABLED}~ROYALTY_EVENT_WRITES_ENABLED=${_ROYALTY_EVENT_WRITES_ENABLED}~RECEIPT_WRITES_ENABLED=${_RECEIPT_WRITES_ENABLED}~PAYMENT_LEDGER_WRITES_ENABLED=${_PAYMENT_LEDGER_WRITES_ENABLED}~SLACK_NOTIFICATION_HISTORY_ENABLED=${_SLACK_NOTIFICATION_HISTORY_ENABLED}~SLACK_CONVERSATION_READ_MODE=${_SLACK_CONVERSATION_READ_MODE}~SLACK_BOT_USER_ID=${_SLACK_BOT_USER_ID}~SLACK_NOTIFICATION_APPROVALS_ENABLED=${_SLACK_NOTIFICATION_APPROVALS_ENABLED}~MATTER_SLACK_ENABLED=${_MATTER_SLACK_ENABLED}~SLACK_LEGAL_CONSULT_CHANNEL=${_SLACK_LEGAL_CONSULT_CHANNEL}~SLACK_DRY_RUN_USER_MAP=${_SLACK_DRY_RUN_USER_MAP}~DB_ACCESS_MODE=readwrite~REQUIRE_DATABASE=true~WRITE_FEATURES_ENABLED=true~WRITE_SCOPES=${_WRITE_SCOPES}~DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE}~DB_PORT=5432~DB_NAME=${_DB_NAME}~DB_USER=${_DB_USER}~DB_POOL_MAX=3~CONTRACT_INTAKE_WRITES_ENABLED=${_CONTRACT_INTAKE_WRITES_ENABLED}~MATTER_WRITES_ENABLED=${_MATTER_WRITES_ENABLED}~VENDOR_WRITES_ENABLED=${_VENDOR_WRITES_ENABLED}~STAFF_WRITES_ENABLED=${_STAFF_WRITES_ENABLED}~WORK_WRITES_ENABLED=${_WORK_WRITES_ENABLED}~MATERIAL_WRITES_ENABLED=${_MATERIAL_WRITES_ENABLED}~RIGHTS_SOURCE_WRITES_ENABLED=${_RIGHTS_SOURCE_WRITES_ENABLED}~VENDOR_MERGE_ENABLED=${_VENDOR_MERGE_ENABLED}~MATTER_MERGE_ENABLED=${_MATTER_MERGE_ENABLED}~MATTER_DELETE_ENABLED=${_MATTER_DELETE_ENABLED}~CONDITION_LINE_REPAIR_ENABLED=${_CONDITION_LINE_REPAIR_ENABLED}~DOCUMENT_VOID_ENABLED=${_DOCUMENT_VOID_ENABLED}~DOCUMENT_REISSUE_ENABLED=${_DOCUMENT_REISSUE_ENABLED}~EXCEL_BATCH_ENABLED=${_EXCEL_BATCH_ENABLED}~SETTINGS_WRITE_ENABLED=${_SETTINGS_WRITE_ENABLED}~WORKFLOW_RULES_WRITE_ENABLED=${_WORKFLOW_RULES_WRITE_ENABLED}~CONTRACT_MASTER_WRITE_ENABLED=${_CONTRACT_MASTER_WRITE_ENABLED}~SNIPPETS_WRITE_ENABLED=${_SNIPPETS_WRITE_ENABLED}~ATTACHMENT_UPLOAD_ENABLED=${_ATTACHMENT_UPLOAD_ENABLED}~SLACK_INTAKE_ENABLED=${_SLACK_INTAKE_ENABLED}~SLACK_INTAKE_UPLOAD_URL=${_SLACK_INTAKE_UPLOAD_URL}~SLACK_INTAKE_VENDOR_SEARCH_URL=${_SLACK_INTAKE_VENDOR_SEARCH_URL}~BACKLOG_INTAKE_ENABLED=${_BACKLOG_INTAKE_ENABLED}~JOBS_ENABLED=${_JOBS_ENABLED}~CONTRACT_EXPIRY_TRANSITION_ENABLED=${_CONTRACT_EXPIRY_TRANSITION_ENABLED}~GMAIL_DELIVERY_MODE=${_GMAIL_DELIVERY_MODE}~GMAIL_SEND_HISTORY_ENABLED=${_GMAIL_SEND_HISTORY_ENABLED}~GMAIL_SENDER=${_GMAIL_SENDER}~CLOUDSIGN_MODE=${_CLOUDSIGN_MODE}~CLOUDSIGN_BASE_URL=${_CLOUDSIGN_BASE_URL}~CLOUDSIGN_ALLOWED_RECIPIENTS=${_CLOUDSIGN_ALLOWED_RECIPIENTS}~CLOUDSIGN_REQUEST_HISTORY_ENABLED=${_CLOUDSIGN_REQUEST_HISTORY_ENABLED}~GMAIL_INBOUND_MODE=${_GMAIL_INBOUND_MODE}~GMAIL_INBOUND_INTAKE_ENABLED=${_GMAIL_INBOUND_INTAKE_ENABLED}~GMAIL_INBOUND_MAILBOX=${_GMAIL_INBOUND_MAILBOX}~OUTBOUND_CONDITION_WRITES_ENABLED=${_OUTBOUND_CONDITION_WRITES_ENABLED}~OUTBOUND_DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE}~OUTBOUND_DB_PORT=5432~OUTBOUND_DB_NAME=${_OUTBOUND_DB_NAME}~OUTBOUND_DB_USER=${_OUTBOUND_DB_USER}"
        if [ "${_DRIVE_STORAGE_ENABLED}" = "true" ]; then
          ENVVARS="$$ENVVARS~GOOGLE_DRIVE_FOLDER_ID=${_GOOGLE_DRIVE_FOLDER_ID}~DRIVE_ENVIRONMENT_TAG=${_DRIVE_ENVIRONMENT_TAG}"
        fi
        # Google Workspace SA 鍵は Drive・Gmail送信・Gmail受信 のいずれかが要求する
        # （DriveはAPI鍵、Gmailはドメイン全体委任のJWT署名にSA秘密鍵が必要）。
        # GOOGLE_SERVICE_ACCOUNT_KEY_PATH は Drive も Gmail送受信（GMAIL_SA_KEY_PATH未設定時の
        # フォールバック）も参照するため、いずれか有効ならマウントする。
        NEEDS_GWS_KEY=false
        if [ "${_DRIVE_STORAGE_ENABLED}" = "true" ] || [ "${_GMAIL_DELIVERY_MODE}" = "live" ] || [ "${_GMAIL_INBOUND_MODE}" = "live" ]; then
          NEEDS_GWS_KEY=true
        fi
        if [ "$$NEEDS_GWS_KEY" = "true" ] && [ -n "${_GWS_SA_KEY_SECRET}" ] && [ "${_GWS_SA_KEY_SECRET}" != "BLOCKED" ]; then
          SECRETS="$$SECRETS,/secrets/gws-service-account.json=${_GWS_SA_KEY_SECRET}:latest"
          ENVVARS="$$ENVVARS~GOOGLE_SERVICE_ACCOUNT_KEY_PATH=/secrets/gws-service-account.json"
        fi
        # Slack Bot トークンは通知ディスパッチ（slack-dispatch）と案件Slack連携（matter-slack）の
        # 双方が参照する。いずれか有効ならマウントする（matter-slack 単独有効でも実送信できるように）。
        if [ "${_SLACK_DISPATCH_ENABLED}" = "true" ] || [ "${_MATTER_SLACK_ENABLED}" = "true" ]; then
          SECRETS="$$SECRETS,SLACK_BOT_TOKEN=${_SLACK_BOT_TOKEN_SECRET}:latest"
        fi
        # 督促ジョブの起動トークン（Cloud Scheduler → /internal/jobs/*・Phase 9）。
        if [ "${_JOBS_ENABLED}" = "true" ] && [ -n "${_JOBS_TRIGGER_TOKEN_SECRET}" ] && [ "${_JOBS_TRIGGER_TOKEN_SECRET}" != "BLOCKED" ]; then
          SECRETS="$$SECRETS,JOBS_TRIGGER_TOKEN=${_JOBS_TRIGGER_TOKEN_SECRET}:latest"
        fi
        # 外部 Webhook 受信の共有シークレット（CloudSign 9-5 / Backlog 9-7）。
        # 設定時のみマウント（未設定＝webhooks-routes が 404 で自動無効）。
        if [ -n "${_SLACK_SIGNING_SECRET_NAME}" ] && [ "${_SLACK_SIGNING_SECRET_NAME}" != "BLOCKED" ]; then
          SECRETS="$$SECRETS,SLACK_SIGNING_SECRET=${_SLACK_SIGNING_SECRET_NAME}:latest"
        fi
        if [ -n "${_CLOUDSIGN_WEBHOOK_TOKEN_SECRET}" ] && [ "${_CLOUDSIGN_WEBHOOK_TOKEN_SECRET}" != "BLOCKED" ]; then
          SECRETS="$$SECRETS,CLOUDSIGN_WEBHOOK_TOKEN=${_CLOUDSIGN_WEBHOOK_TOKEN_SECRET}:latest"
        fi
        if [ -n "${_BACKLOG_WEBHOOK_TOKEN_SECRET}" ] && [ "${_BACKLOG_WEBHOOK_TOKEN_SECRET}" != "BLOCKED" ]; then
          SECRETS="$$SECRETS,BACKLOG_WEBHOOK_TOKEN=${_BACKLOG_WEBHOOK_TOKEN_SECRET}:latest"
        fi
        # CloudSign client_id は Secret Manager から CLOUDSIGN_CLIENT_ID env として注入する
        # （平文 substitution にしない）。live かつシークレット名が設定されたときのみ。
        if [ "${_CLOUDSIGN_MODE}" = "live" ] && [ -n "${_CLOUDSIGN_CLIENT_ID_SECRET}" ] && [ "${_CLOUDSIGN_CLIENT_ID_SECRET}" != "BLOCKED" ]; then
          SECRETS="$$SECRETS,CLOUDSIGN_CLIENT_ID=${_CLOUDSIGN_CLIENT_ID_SECRET}:latest"
        fi
        # メモリ 2Gi の理由: PDF 生成は Chromium を起動する。1Gi・同時2件では実測
        # 1057 MiB に達してコンテナが OOM で終了し、Drive 保存が HTTP 503（本文は
        # 素の "Service Unavailable"）で落ちていた（2026-08-17 のログで確認）。
        # Chromium 1本ぶんの余裕を確保する。
        # 注意: 以下は行継続（\）で1つのコマンド。途中にコメント行を挟むと
        # そこで論理行が切れ、続く --memory=... がコマンド名として実行されて
        # exit 127 になる。コメントはこの位置に置く。
        gcloud run deploy "${_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}" \
          --region="${_REGION}" \
          --platform=managed \
          --memory=2Gi \
          --cpu=1 \
          --concurrency=2 \
          --no-allow-unauthenticated \
          --service-account="${_SERVICE_ACCOUNT}" \
          --add-cloudsql-instances="${_CLOUD_SQL_INSTANCE}" \
          --set-secrets="$$SECRETS" \
          --set-env-vars="$$ENVVARS"

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY
