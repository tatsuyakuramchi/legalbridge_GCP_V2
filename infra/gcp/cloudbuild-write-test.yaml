substitutions:
  _REGION: asia-northeast1
  _SERVICE: legalbridge-v2-write-test
  _AR_REPOSITORY: legalbridge
  _IMAGE: legalbridge-v2-write-test
  _CLOUD_SQL_INSTANCE: legalbridge-488506:asia-northeast1:legalbridge-db
  _DB_NAME: legalbridge_v2_validation
  _DB_USER: legalbridge_v2_validation_writer
  _DB_PASSWORD_SECRET: legalbridge-v2-validation-writer-db-password
  _SERVICE_ACCOUNT: legalbridge-v2-preview@legalbridge-488506.iam.gserviceaccount.com
  _PRIMARY_DB_MODE: validation
  _CONFIRM_ISOLATED_DB: BLOCKED
  _CONFIRM_PRODUCTION_PRIMARY: BLOCKED
  _CONFIRM_DOCUMENT_TABLES: BLOCKED
  _AUTH_MODE: disabled
  _AUTH_ADMIN_EMAILS: BLOCKED
  _AUTH_LEGAL_EMAILS: BLOCKED
  _AUTH_REQUESTER_DOMAINS: BLOCKED
  _CONFIRM_IAP_BACKEND: BLOCKED
  _CONFIRM_CLOUDRUN_IAM: BLOCKED
  _SLACK_NOTIFICATION_HISTORY_ENABLED: "false"
  _SLACK_NOTIFICATION_APPROVALS_ENABLED: "false"
  _SLACK_APPROVAL_WRITES_ENABLED: "false"
  _WRITE_SCOPES: drafts,documents,pdf
  _CONFIRM_SLACK_APPROVAL_WRITES: BLOCKED
  _SLACK_DRY_RUN_USER_MAP: UNRESOLVED
  _INTEGRATION_MODE: local
  _SLACK_DELIVERY_MODE: disabled
  _BACKLOG_MODE: disabled
  _BACKLOG_HOST: BLOCKED
  _BACKLOG_PROJECT_KEY: BLOCKED
  _BACKLOG_API_KEY_SECRET: backlog-api-key
  _CONFIRM_BACKLOG_READONLY: BLOCKED
  _OUTBOUND_CONDITION_WRITES_ENABLED: "false"
  _OUTBOUND_DB_NAME: BLOCKED
  _OUTBOUND_DB_USER: BLOCKED
  _OUTBOUND_DB_PASSWORD_SECRET: legalbridge-v2-outbound-db-password
  _CONFIRM_OUTBOUND_WRITES: BLOCKED
  _CONTRACT_INTAKE_WRITES_ENABLED: "false"
  _CONFIRM_CONTRACT_INTAKE_WRITES: BLOCKED
  _MATTER_WRITES_ENABLED: "false"
  _CONFIRM_MATTER_WRITES: BLOCKED
  _VENDOR_WRITES_ENABLED: "false"
  _CONFIRM_VENDOR_WRITES: BLOCKED
  _STAFF_WRITES_ENABLED: "false"
  _CONFIRM_STAFF_WRITES: BLOCKED
  _WORK_WRITES_ENABLED: "false"
  _CONFIRM_WORK_WRITES: BLOCKED
  _MATERIAL_WRITES_ENABLED: "false"
  _CONFIRM_MATERIAL_WRITES: BLOCKED
  _RIGHTS_SOURCE_WRITES_ENABLED: "false"
  _CONFIRM_RIGHTS_SOURCE_WRITES: BLOCKED
  _VENDOR_MERGE_ENABLED: "false"
  _CONFIRM_VENDOR_MERGE: BLOCKED
  _MATTER_MERGE_ENABLED: "false"
  _CONFIRM_MATTER_MERGE: BLOCKED
  _MATTER_DELETE_ENABLED: "false"
  _CONFIRM_MATTER_DELETE: BLOCKED
  _BACKLOG_COMMENT_WRITE_ENABLED: "false"
  _CONFIRM_BACKLOG_COMMENT_WRITE: BLOCKED
  _GMAIL_DELIVERY_MODE: disabled
  _CONFIRM_GMAIL_DISPATCH: BLOCKED
  _GMAIL_SENDER: BLOCKED
  _GMAIL_SEND_HISTORY_ENABLED: "false"
  _CLOUDSIGN_MODE: disabled
  _CONFIRM_CLOUDSIGN_DISPATCH: BLOCKED
  # CloudSign client_id は機微情報のため Secret Manager から注入する（平文 env にしない）。
  # 値ではなく Secret Manager のシークレット名を渡す（例: cloudsign-client-id）。
  _CLOUDSIGN_CLIENT_ID_SECRET: BLOCKED
  _CLOUDSIGN_BASE_URL: https://api.cloudsign.jp
  _CLOUDSIGN_ALLOWED_RECIPIENTS: ""
  _CLOUDSIGN_REQUEST_HISTORY_ENABLED: "false"
  _GMAIL_INBOUND_MODE: disabled
  _GMAIL_INBOUND_INTAKE_ENABLED: "false"
  _CONFIRM_GMAIL_INBOUND: BLOCKED
  _GMAIL_INBOUND_MAILBOX: BLOCKED
  _DRIVE_STORAGE_ENABLED: "false"
  _CONFIRM_DRIVE_STORAGE: BLOCKED
  _GOOGLE_DRIVE_FOLDER_ID: BLOCKED
  _GWS_SA_KEY_SECRET: BLOCKED
  _DRIVE_ENVIRONMENT_TAG: validation
  _SLACK_DISPATCH_ENABLED: "false"
  _MATTER_SLACK_ENABLED: "false"
  _SLACK_LEGAL_CONSULT_CHANNEL: ""
  _CONFIRM_SLACK_DISPATCH: BLOCKED
  _SLACK_BOT_TOKEN_SECRET: SLACK_BOT_TOKEN

steps:
  - id: test
    name: node:22
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci
        npm run typecheck
        npm test
        npm run build

  - id: verify-isolation
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        AUTH_ADMIN_EMAILS="${_AUTH_ADMIN_EMAILS}"
        AUTH_LEGAL_EMAILS="${_AUTH_LEGAL_EMAILS}"
        AUTH_MODE="${_AUTH_MODE}"
        AUTH_REQUESTER_DOMAINS="${_AUTH_REQUESTER_DOMAINS}"
        BACKLOG_HOST="${_BACKLOG_HOST}"
        BACKLOG_MODE="${_BACKLOG_MODE}"
        BACKLOG_PROJECT_KEY="${_BACKLOG_PROJECT_KEY}"
        CONFIRM_BACKLOG_READONLY="${_CONFIRM_BACKLOG_READONLY}"
        CONFIRM_CLOUDRUN_IAM="${_CONFIRM_CLOUDRUN_IAM}"
        CONFIRM_CONTRACT_INTAKE_WRITES="${_CONFIRM_CONTRACT_INTAKE_WRITES}"
        CONFIRM_DOCUMENT_TABLES="${_CONFIRM_DOCUMENT_TABLES}"
        CONFIRM_DRIVE_STORAGE="${_CONFIRM_DRIVE_STORAGE}"
        CONFIRM_IAP_BACKEND="${_CONFIRM_IAP_BACKEND}"
        CONFIRM_ISOLATED_DB="${_CONFIRM_ISOLATED_DB}"
        CONFIRM_OUTBOUND_WRITES="${_CONFIRM_OUTBOUND_WRITES}"
        CONFIRM_PRODUCTION_PRIMARY="${_CONFIRM_PRODUCTION_PRIMARY}"
        CONFIRM_SLACK_APPROVAL_WRITES="${_CONFIRM_SLACK_APPROVAL_WRITES}"
        CONFIRM_SLACK_DISPATCH="${_CONFIRM_SLACK_DISPATCH}"
        CONTRACT_INTAKE_WRITES_ENABLED="${_CONTRACT_INTAKE_WRITES_ENABLED}"
        CONFIRM_MATTER_WRITES="${_CONFIRM_MATTER_WRITES}"
        MATTER_WRITES_ENABLED="${_MATTER_WRITES_ENABLED}"
        CONFIRM_VENDOR_WRITES="${_CONFIRM_VENDOR_WRITES}"
        VENDOR_WRITES_ENABLED="${_VENDOR_WRITES_ENABLED}"
        CONFIRM_STAFF_WRITES="${_CONFIRM_STAFF_WRITES}"
        STAFF_WRITES_ENABLED="${_STAFF_WRITES_ENABLED}"
        CONFIRM_WORK_WRITES="${_CONFIRM_WORK_WRITES}"
        WORK_WRITES_ENABLED="${_WORK_WRITES_ENABLED}"
        CONFIRM_MATERIAL_WRITES="${_CONFIRM_MATERIAL_WRITES}"
        MATERIAL_WRITES_ENABLED="${_MATERIAL_WRITES_ENABLED}"
        CONFIRM_RIGHTS_SOURCE_WRITES="${_CONFIRM_RIGHTS_SOURCE_WRITES}"
        RIGHTS_SOURCE_WRITES_ENABLED="${_RIGHTS_SOURCE_WRITES_ENABLED}"
        CONFIRM_VENDOR_MERGE="${_CONFIRM_VENDOR_MERGE}"
        VENDOR_MERGE_ENABLED="${_VENDOR_MERGE_ENABLED}"
        CONFIRM_MATTER_MERGE="${_CONFIRM_MATTER_MERGE}"
        MATTER_MERGE_ENABLED="${_MATTER_MERGE_ENABLED}"
        CONFIRM_MATTER_DELETE="${_CONFIRM_MATTER_DELETE}"
        MATTER_DELETE_ENABLED="${_MATTER_DELETE_ENABLED}"
        CONFIRM_BACKLOG_COMMENT_WRITE="${_CONFIRM_BACKLOG_COMMENT_WRITE}"
        BACKLOG_COMMENT_WRITE_ENABLED="${_BACKLOG_COMMENT_WRITE_ENABLED}"
        GMAIL_DELIVERY_MODE="${_GMAIL_DELIVERY_MODE}"
        GMAIL_SEND_HISTORY_ENABLED="${_GMAIL_SEND_HISTORY_ENABLED}"
        CONFIRM_GMAIL_DISPATCH="${_CONFIRM_GMAIL_DISPATCH}"
        GMAIL_SENDER="${_GMAIL_SENDER}"
        CLOUDSIGN_MODE="${_CLOUDSIGN_MODE}"
        CONFIRM_CLOUDSIGN_DISPATCH="${_CONFIRM_CLOUDSIGN_DISPATCH}"
        CLOUDSIGN_CLIENT_ID_SECRET="${_CLOUDSIGN_CLIENT_ID_SECRET}"
        CLOUDSIGN_ALLOWED_RECIPIENTS="${_CLOUDSIGN_ALLOWED_RECIPIENTS}"
        CLOUDSIGN_REQUEST_HISTORY_ENABLED="${_CLOUDSIGN_REQUEST_HISTORY_ENABLED}"
        GMAIL_INBOUND_MODE="${_GMAIL_INBOUND_MODE}"
        GMAIL_INBOUND_INTAKE_ENABLED="${_GMAIL_INBOUND_INTAKE_ENABLED}"
        CONFIRM_GMAIL_INBOUND="${_CONFIRM_GMAIL_INBOUND}"
        GMAIL_INBOUND_MAILBOX="${_GMAIL_INBOUND_MAILBOX}"
        DB_NAME="${_DB_NAME}"
        DB_PASSWORD_SECRET="${_DB_PASSWORD_SECRET}"
        DB_USER="${_DB_USER}"
        DRIVE_STORAGE_ENABLED="${_DRIVE_STORAGE_ENABLED}"
        GOOGLE_DRIVE_FOLDER_ID="${_GOOGLE_DRIVE_FOLDER_ID}"
        OUTBOUND_CONDITION_WRITES_ENABLED="${_OUTBOUND_CONDITION_WRITES_ENABLED}"
        OUTBOUND_DB_NAME="${_OUTBOUND_DB_NAME}"
        OUTBOUND_DB_PASSWORD_SECRET="${_OUTBOUND_DB_PASSWORD_SECRET}"
        OUTBOUND_DB_USER="${_OUTBOUND_DB_USER}"
        PRIMARY_DB_MODE="${_PRIMARY_DB_MODE}"
        SERVICE="${_SERVICE}"
        SLACK_APPROVAL_WRITES_ENABLED="${_SLACK_APPROVAL_WRITES_ENABLED}"
        SLACK_BOT_TOKEN_SECRET="${_SLACK_BOT_TOKEN_SECRET}"
        SLACK_DELIVERY_MODE="${_SLACK_DELIVERY_MODE}"
        INTEGRATION_MODE="${_INTEGRATION_MODE}"
        SLACK_DISPATCH_ENABLED="${_SLACK_DISPATCH_ENABLED}"
        MATTER_SLACK_ENABLED="${_MATTER_SLACK_ENABLED}"
        SLACK_LEGAL_CONSULT_CHANNEL="${_SLACK_LEGAL_CONSULT_CHANNEL}"
        SLACK_DRY_RUN_USER_MAP="${_SLACK_DRY_RUN_USER_MAP}"
        SLACK_NOTIFICATION_APPROVALS_ENABLED="${_SLACK_NOTIFICATION_APPROVALS_ENABLED}"
        SLACK_NOTIFICATION_HISTORY_ENABLED="${_SLACK_NOTIFICATION_HISTORY_ENABLED}"
        WRITE_SCOPES="${_WRITE_SCOPES}"
        export AUTH_ADMIN_EMAILS AUTH_LEGAL_EMAILS AUTH_MODE AUTH_REQUESTER_DOMAINS BACKLOG_HOST BACKLOG_MODE BACKLOG_PROJECT_KEY CONFIRM_BACKLOG_READONLY CONFIRM_CLOUDRUN_IAM CONFIRM_CONTRACT_INTAKE_WRITES CONFIRM_DOCUMENT_TABLES CONFIRM_DRIVE_STORAGE CONFIRM_IAP_BACKEND CONFIRM_ISOLATED_DB CONFIRM_MATTER_WRITES CONFIRM_OUTBOUND_WRITES CONFIRM_PRODUCTION_PRIMARY CONFIRM_SLACK_APPROVAL_WRITES CONFIRM_SLACK_DISPATCH CONFIRM_STAFF_WRITES CONFIRM_VENDOR_WRITES CONFIRM_WORK_WRITES CONFIRM_MATERIAL_WRITES CONFIRM_RIGHTS_SOURCE_WRITES RIGHTS_SOURCE_WRITES_ENABLED CONFIRM_VENDOR_MERGE VENDOR_MERGE_ENABLED CONFIRM_MATTER_MERGE MATTER_MERGE_ENABLED CONFIRM_MATTER_DELETE MATTER_DELETE_ENABLED CONFIRM_BACKLOG_COMMENT_WRITE BACKLOG_COMMENT_WRITE_ENABLED CONTRACT_INTAKE_WRITES_ENABLED DB_NAME DB_PASSWORD_SECRET DB_USER DRIVE_STORAGE_ENABLED GOOGLE_DRIVE_FOLDER_ID MATTER_WRITES_ENABLED STAFF_WRITES_ENABLED VENDOR_WRITES_ENABLED WORK_WRITES_ENABLED MATERIAL_WRITES_ENABLED GMAIL_DELIVERY_MODE GMAIL_SEND_HISTORY_ENABLED CONFIRM_GMAIL_DISPATCH GMAIL_SENDER CLOUDSIGN_MODE CONFIRM_CLOUDSIGN_DISPATCH CLOUDSIGN_CLIENT_ID_SECRET CLOUDSIGN_ALLOWED_RECIPIENTS CLOUDSIGN_REQUEST_HISTORY_ENABLED GMAIL_INBOUND_MODE GMAIL_INBOUND_INTAKE_ENABLED CONFIRM_GMAIL_INBOUND GMAIL_INBOUND_MAILBOX OUTBOUND_CONDITION_WRITES_ENABLED OUTBOUND_DB_NAME OUTBOUND_DB_PASSWORD_SECRET OUTBOUND_DB_USER PRIMARY_DB_MODE SERVICE SLACK_APPROVAL_WRITES_ENABLED SLACK_BOT_TOKEN_SECRET SLACK_DELIVERY_MODE SLACK_DISPATCH_ENABLED SLACK_DRY_RUN_USER_MAP SLACK_NOTIFICATION_APPROVALS_ENABLED SLACK_NOTIFICATION_HISTORY_ENABLED MATTER_SLACK_ENABLED SLACK_LEGAL_CONSULT_CHANNEL INTEGRATION_MODE WRITE_SCOPES
        bash infra/gcp/verify-write-test.sh
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        SECRETS="DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,BACKLOG_API_KEY=${_BACKLOG_API_KEY_SECRET}:latest,OUTBOUND_DB_PASSWORD=${_OUTBOUND_DB_PASSWORD_SECRET}:latest"
        ENVVARS="^~^NODE_ENV=production~AUTH_MODE=${_AUTH_MODE}~AUTH_ADMIN_EMAILS=${_AUTH_ADMIN_EMAILS}~AUTH_LEGAL_EMAILS=${_AUTH_LEGAL_EMAILS}~AUTH_REQUESTER_DOMAINS=${_AUTH_REQUESTER_DOMAINS}~INTEGRATION_MODE=${_INTEGRATION_MODE}~SLACK_DELIVERY_MODE=${_SLACK_DELIVERY_MODE}~BACKLOG_MODE=${_BACKLOG_MODE}~BACKLOG_HOST=${_BACKLOG_HOST}~BACKLOG_PROJECT_KEY=${_BACKLOG_PROJECT_KEY}~BACKLOG_COMMENT_WRITE_ENABLED=${_BACKLOG_COMMENT_WRITE_ENABLED}~SLACK_NOTIFICATION_HISTORY_ENABLED=${_SLACK_NOTIFICATION_HISTORY_ENABLED}~SLACK_NOTIFICATION_APPROVALS_ENABLED=${_SLACK_NOTIFICATION_APPROVALS_ENABLED}~MATTER_SLACK_ENABLED=${_MATTER_SLACK_ENABLED}~SLACK_LEGAL_CONSULT_CHANNEL=${_SLACK_LEGAL_CONSULT_CHANNEL}~SLACK_DRY_RUN_USER_MAP=${_SLACK_DRY_RUN_USER_MAP}~DB_ACCESS_MODE=readwrite~REQUIRE_DATABASE=true~WRITE_FEATURES_ENABLED=true~WRITE_SCOPES=${_WRITE_SCOPES}~DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE}~DB_PORT=5432~DB_NAME=${_DB_NAME}~DB_USER=${_DB_USER}~DB_POOL_MAX=3~CONTRACT_INTAKE_WRITES_ENABLED=${_CONTRACT_INTAKE_WRITES_ENABLED}~MATTER_WRITES_ENABLED=${_MATTER_WRITES_ENABLED}~VENDOR_WRITES_ENABLED=${_VENDOR_WRITES_ENABLED}~STAFF_WRITES_ENABLED=${_STAFF_WRITES_ENABLED}~WORK_WRITES_ENABLED=${_WORK_WRITES_ENABLED}~MATERIAL_WRITES_ENABLED=${_MATERIAL_WRITES_ENABLED}~RIGHTS_SOURCE_WRITES_ENABLED=${_RIGHTS_SOURCE_WRITES_ENABLED}~VENDOR_MERGE_ENABLED=${_VENDOR_MERGE_ENABLED}~MATTER_MERGE_ENABLED=${_MATTER_MERGE_ENABLED}~MATTER_DELETE_ENABLED=${_MATTER_DELETE_ENABLED}~GMAIL_DELIVERY_MODE=${_GMAIL_DELIVERY_MODE}~GMAIL_SEND_HISTORY_ENABLED=${_GMAIL_SEND_HISTORY_ENABLED}~GMAIL_SENDER=${_GMAIL_SENDER}~CLOUDSIGN_MODE=${_CLOUDSIGN_MODE}~CLOUDSIGN_BASE_URL=${_CLOUDSIGN_BASE_URL}~CLOUDSIGN_ALLOWED_RECIPIENTS=${_CLOUDSIGN_ALLOWED_RECIPIENTS}~CLOUDSIGN_REQUEST_HISTORY_ENABLED=${_CLOUDSIGN_REQUEST_HISTORY_ENABLED}~GMAIL_INBOUND_MODE=${_GMAIL_INBOUND_MODE}~GMAIL_INBOUND_INTAKE_ENABLED=${_GMAIL_INBOUND_INTAKE_ENABLED}~GMAIL_INBOUND_MAILBOX=${_GMAIL_INBOUND_MAILBOX}~OUTBOUND_CONDITION_WRITES_ENABLED=${_OUTBOUND_CONDITION_WRITES_ENABLED}~OUTBOUND_DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE}~OUTBOUND_DB_PORT=5432~OUTBOUND_DB_NAME=${_OUTBOUND_DB_NAME}~OUTBOUND_DB_USER=${_OUTBOUND_DB_USER}"
        if [ "${_DRIVE_STORAGE_ENABLED}" = "true" ]; then
          ENVVARS="$$ENVVARS~GOOGLE_DRIVE_FOLDER_ID=${_GOOGLE_DRIVE_FOLDER_ID}~DRIVE_ENVIRONMENT_TAG=${_DRIVE_ENVIRONMENT_TAG}"
        fi
        # Google Workspace SA 鍵は Drive・Gmail送信・Gmail受信 のいずれかが要求する
        # （DriveはAPI鍵、Gmailはドメイン全体委任のJWT署名にSA秘密鍵が必要）。
        # GOOGLE_SERVICE_ACCOUNT_KEY_PATH は Drive も Gmail送受信（GMAIL_SA_KEY_PATH未設定時の
        # フォールバック）も参照するため、いずれか有効ならマウントする。
        NEEDS_GWS_KEY=false
        if [ "${_DRIVE_STORAGE_ENABLED}" = "true" ] || [ "${_GMAIL_DELIVERY_MODE}" = "live" ] || [ "${_GMAIL_INBOUND_MODE}" = "live" ]; then
          NEEDS_GWS_KEY=true
        fi
        if [ "$$NEEDS_GWS_KEY" = "true" ] && [ -n "${_GWS_SA_KEY_SECRET}" ] && [ "${_GWS_SA_KEY_SECRET}" != "BLOCKED" ]; then
          SECRETS="$$SECRETS,/secrets/gws-service-account.json=${_GWS_SA_KEY_SECRET}:latest"
          ENVVARS="$$ENVVARS~GOOGLE_SERVICE_ACCOUNT_KEY_PATH=/secrets/gws-service-account.json"
        fi
        if [ "${_SLACK_DISPATCH_ENABLED}" = "true" ]; then
          SECRETS="$$SECRETS,SLACK_BOT_TOKEN=${_SLACK_BOT_TOKEN_SECRET}:latest"
        fi
        # CloudSign client_id は Secret Manager から CLOUDSIGN_CLIENT_ID env として注入する
        # （平文 substitution にしない）。live かつシークレット名が設定されたときのみ。
        if [ "${_CLOUDSIGN_MODE}" = "live" ] && [ -n "${_CLOUDSIGN_CLIENT_ID_SECRET}" ] && [ "${_CLOUDSIGN_CLIENT_ID_SECRET}" != "BLOCKED" ]; then
          SECRETS="$$SECRETS,CLOUDSIGN_CLIENT_ID=${_CLOUDSIGN_CLIENT_ID_SECRET}:latest"
        fi
        gcloud run deploy "${_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}" \
          --region="${_REGION}" \
          --platform=managed \
          --memory=1Gi \
          --cpu=1 \
          --concurrency=2 \
          --no-allow-unauthenticated \
          --service-account="${_SERVICE_ACCOUNT}" \
          --add-cloudsql-instances="${_CLOUD_SQL_INSTANCE}" \
          --set-secrets="$$SECRETS" \
          --set-env-vars="$$ENVVARS"

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE}:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY
