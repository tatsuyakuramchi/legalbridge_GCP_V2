# LegalBridge V3 予備系（GCP 停止時の参照用）・開発用のローカル構成。
#
#   db   ローカルの PostgreSQL。平時から上げっぱなしにして、毎晩の同期で
#        本番 v3 スキーマの写しを受け取る。
#   app  V3 本体（本番と同じ Dockerfile.v3）。既定は読み取り専用。
#   ops  同期・復元・開発用初期化を行う作業用コンテナ。使うときだけ
#        `docker compose run --rm ops <サブコマンド>` で起動する。
#
# 設定は同じフォルダの .env（.env.example を写して埋める）。
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?LOCAL_DB_PASSWORD を .env に書いてください}
      POSTGRES_DB: legalbridge
      V3_RUNTIME_PASSWORD: ${V3_RUNTIME_PASSWORD:?V3_RUNTIME_PASSWORD を .env に書いてください}
      TZ: Asia/Tokyo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legalbridge"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 外へは出さない。psql で覗くときは `docker compose exec db psql -U postgres legalbridge`。

  app:
    build:
      context: ../..
      dockerfile: Dockerfile.v3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      # 従来の接続先（切り替えを使っていないときはこれ）。手元のローカル DB。
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: legalbridge
      DB_SCHEMA: v3
      # 本番と同じく、権限を絞ったランタイムロールで接続する。
      DB_USER: legalbridge_v3_runtime
      DB_PASSWORD: ${V3_RUNTIME_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      # DB の接続先の切り替え（docs/v3-local-app-cloud-db.md §3）。/data/DB_TARGET の中身（primary / standby）で
      # 決める。ops failover / failback が書き換える。ファイルが無ければ DB_TARGET、それも無ければ上の DB_*。
      DB_TARGET_PATH: /data/DB_TARGET
      DB_TARGET: ${DB_TARGET:-}
      # primary＝本番（Cloud SQL）。経路（Proxy・トンネル）が PC 側なら host.docker.internal:5433 など。
      # 揃っていなければ DB_* に落ちる。
      PRIMARY_DB_HOST: ${PRIMARY_DB_HOST:-}
      PRIMARY_DB_PORT: ${PRIMARY_DB_PORT:-5432}
      PRIMARY_DB_NAME: ${PRIMARY_DB_NAME:-legalbridge}
      PRIMARY_DB_USER: ${PRIMARY_DB_USER:-legalbridge_v3_runtime}
      PRIMARY_DB_PASSWORD: ${PRIMARY_DB_PASSWORD:-}
      # standby＝手元の写し（上の db）。
      STANDBY_DB_HOST: ${STANDBY_DB_HOST:-db}
      STANDBY_DB_PORT: ${STANDBY_DB_PORT:-5432}
      STANDBY_DB_NAME: ${STANDBY_DB_NAME:-legalbridge}
      STANDBY_DB_USER: ${STANDBY_DB_USER:-legalbridge_v3_runtime}
      STANDBY_DB_PASSWORD: ${STANDBY_DB_PASSWORD:-${V3_RUNTIME_PASSWORD}}
      # 予備系は読み取り専用が既定。開発で書き込むとき、本番につなぐ構成、本番停止中に写しで書くときは .env で false にする。
      READ_ONLY: ${READ_ONLY:-true}
      # 番号帯。backup＝予備系の帯（文書番号などを 9000 番台、5 桁なら 90000 番台から振り、本番の連番と重ねない。
      # 持ち帰っても番号が変わらない。docs/v3-backup-merge.md）。auto＝本番（primary）につないでいるときだけ
      # 本番の連番、それ以外は backup。本番につなぐ構成では .env で auto にする。本番（Cloud Run）には付けない。
      NUMBER_BAND: ${NUMBER_BAND:-backup}
      # 認証。既定は disabled（全員が LOCAL_USER_* を名乗る）。Cloudflare Tunnel で
      # 社外に出すときは cloudflare にし、Access のトークンを検証して人ごとに役割を決める。
      AUTH_MODE: ${AUTH_MODE:-disabled}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      LEGAL_EMAILS: ${LEGAL_EMAILS:-}
      REQUESTER_DOMAINS: ${REQUESTER_DOMAINS:-}
      LOCAL_USER_EMAIL: ${LOCAL_USER_EMAIL:-backup@local}
      LOCAL_USER_ROLE: ${LOCAL_USER_ROLE:-admin}
      SITE_LABEL: ${SITE_LABEL:-予備系}
      DATA_STAMP_PATH: /data/SYNC_STAMP
      # ファイルは既定で Drive ではなく手元のフォルダへ（./data/files）。
      # DRIVE_STORAGE=drive にすると、本番と同じ Drive のフォルダへ、本番の SA になりすまして保存する
      # （DRIVE_IMPERSONATE_SA。認証はメールと同じ人のログイン GMAIL_ADC_PATH。docs/v3-local-gmail.md）。
      DRIVE_STORAGE: ${DRIVE_STORAGE:-local}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      DRIVE_ENVIRONMENT_TAG: ${DRIVE_ENVIRONMENT_TAG:-}
      DRIVE_MATTER_PARENT_FOLDER_ID: ${DRIVE_MATTER_PARENT_FOLDER_ID:-}
      DRIVE_IMPERSONATE_SA: ${DRIVE_IMPERSONATE_SA:-}
      LOCAL_FILES_DIR: /data/files
      CHROMIUM_PATH: /usr/bin/chromium-browser
      # 外部連携は既定で止める（設定しない＝off）。Backlog・Slack は送らない。
      SLACK_MODE: "off"
      # メール（Gmail）だけは .env で開けられる（本番停止中に予備系から送るため。
      # docs/v3-local-gmail.md）。既定は off。GOOGLE_APPLICATION_CREDENTIALS は keys/adc.json
      # （docker compose run --rm login で取る人のログイン）を指す。Drive に保存するときも同じものを使う。
      GMAIL_MODE: ${GMAIL_MODE:-off}
      GMAIL_SENDER: ${GMAIL_SENDER:-}
      GMAIL_DELEGATION_SA: ${GMAIL_DELEGATION_SA:-}
      DISPATCH_ALLOWLIST: ${DISPATCH_ALLOWLIST:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GMAIL_ADC_PATH:-}
      # 画面の「Google にログイン」（gcloud を使わずに人のログインを取る。docs/v3-local-gmail.md）。
      # OAuth クライアント（ウェブ アプリケーション）の ID とシークレット。保存先は /data（書ける側）。
      GOOGLE_LOGIN_CLIENT_ID: ${GOOGLE_LOGIN_CLIENT_ID:-}
      GOOGLE_LOGIN_CLIENT_SECRET: ${GOOGLE_LOGIN_CLIENT_SECRET:-}
      GOOGLE_LOGIN_PATH: /data/google-login.json
      GOOGLE_LOGIN_REDIRECT_URL: ${GOOGLE_LOGIN_REDIRECT_URL:-}
      # CloudSign も .env で開けられる（docs/v3-local-gmail.md の「CloudSign で送る」）。既定は off。
      # 締結の知らせ（webhook）は本番に届くので、予備系では手で記録するか、トンネルで受ける。
      CLOUDSIGN_MODE: ${CLOUDSIGN_MODE:-off}
      CLOUDSIGN_CLIENT_ID: ${CLOUDSIGN_CLIENT_ID:-}
      CLOUDSIGN_AUTO_SEND: ${CLOUDSIGN_AUTO_SEND:-false}
      # 外からの知らせ（webhook）の合言葉。空なら受け口は閉じたまま。
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
      BACKLOG_MODE: "off"
      TZ: Asia/Tokyo
    volumes:
      - ./data:/data
      # 人のログイン（keys/adc.json）。メールを開けるときだけ使う（GMAIL_ADC_PATH）。
      - ./keys:/keys:ro

  # 社外から使うときの口（Cloudflare Tunnel）。PC から Cloudflare へ外向きにつなぐので、
  # ルーターのポート開放も固定 IP も要らない。普段の up では立たない（profile: tunnel）。
  #   docker compose --profile tunnel up -d
  # 手順は README の「社外から使う（Cloudflare Tunnel）」。
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app

  # お試し用の口（Cloudflare の Quick Tunnel）。アカウントもドメインも要らず無料。
  # 起動するたびに https://○○.trycloudflare.com の URL が変わり、ログインは付かない。
  # URL を知っている人は誰でも入れるので、READ_ONLY=true・LOCAL_USER_ROLE=requester で
  # 短い間だけ使う。URL は docker compose logs quicktunnel に出る。
  #   docker compose --profile quicktunnel up -d
  quicktunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["quicktunnel"]
    command: tunnel --no-autoupdate --url http://app:8080
    depends_on:
      - app

  ops:
    build: ./ops
    profiles: ["ops"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${LOCAL_DB_PASSWORD}
      PGDATABASE: legalbridge
      CLOUD_SQL_INSTANCE: ${CLOUD_SQL_INSTANCE:-}
      # 経路の確認（ops netcheck）で 3307・5432 を試す宛先。空なら引数か keys/adc.json で調べる。
      CLOUD_SQL_IP: ${CLOUD_SQL_IP:-}
      # DB の接続先の切り替え（ops target / failover / failback）。app と同じファイルと接続先。
      DB_TARGET_PATH: /data/DB_TARGET
      PRIMARY_DB_HOST: ${PRIMARY_DB_HOST:-}
      PRIMARY_DB_PORT: ${PRIMARY_DB_PORT:-5432}
      PRIMARY_DB_NAME: ${PRIMARY_DB_NAME:-legalbridge}
      PRIMARY_DB_USER: ${PRIMARY_DB_USER:-legalbridge_v3_runtime}
      PRIMARY_DB_PASSWORD: ${PRIMARY_DB_PASSWORD:-}
      # 持ち帰りの SQL を本番で流すロール（表の所有者。postgres 相当）。無ければ PRIMARY_DB_USER。
      PRIMARY_ADMIN_USER: ${PRIMARY_ADMIN_USER:-}
      PRIMARY_ADMIN_PASSWORD: ${PRIMARY_ADMIN_PASSWORD:-}
      STANDBY_DB_HOST: ${STANDBY_DB_HOST:-db}
      STANDBY_DB_PORT: ${STANDBY_DB_PORT:-5432}
      STANDBY_DB_NAME: ${STANDBY_DB_NAME:-legalbridge}
      REHEARSAL_DB_HOST: db-primary
      REMOTE_DB_NAME: ${REMOTE_DB_NAME:-legalbridge}
      SYNC_DB_USER: ${SYNC_DB_USER:-legalbridge_v3_backup}
      SYNC_DB_PASSWORD: ${SYNC_DB_PASSWORD:-}
      # 写しの取り方。proxy（既定・3307 番を使う）か export（443 番だけ）。
      SYNC_MODE: ${SYNC_MODE:-proxy}
      EXPORT_BUCKET: ${EXPORT_BUCKET:-}
      EXPORT_SUBDIR: ${EXPORT_SUBDIR:-}
      # Proxy を PC 側で動かすときだけ設定する（3307 番が塞がれている環境）。
      SYNC_DB_HOST: ${SYNC_DB_HOST:-}
      SYNC_DB_PORT: ${SYNC_DB_PORT:-5433}
      KEEP_DUMPS: ${KEEP_DUMPS:-14}
      TZ: Asia/Tokyo
    extra_hosts:
      # PC 側で動かす Proxy を host.docker.internal で呼べるようにする（Linux 用）。
      - "host.docker.internal:host-gateway"
    volumes:
      - ./bin/ops.sh:/usr/local/bin/ops:ro
      - ../v3:/v3:ro
      - ./sql:/local-sql:ro
      - ./dumps:/dumps
      - ./data:/data
      - ./keys:/keys:ro
    entrypoint: ["bash", "/usr/local/bin/ops"]

  # 予行用の「本番役」の DB（docs/v3-local-app-cloud-db.md「予行」）。本番に触らずに
  # 切り替え → 書く → 戻す を一巡するためのもの。普段の up では立たない（profile: rehearsal）。
  #   docker compose --profile rehearsal up -d db-primary
  #   docker compose run --rm ops rehearse-init      # 手元の写しを本番役に入れる
  # 管理者とランタイムロールのパスワードはローカル DB と同じ（.env の LOCAL_DB_PASSWORD / V3_RUNTIME_PASSWORD）。
  db-primary:
    image: postgres:17-alpine
    profiles: ["rehearsal"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?LOCAL_DB_PASSWORD を .env に書いてください}
      POSTGRES_DB: legalbridge
      V3_RUNTIME_PASSWORD: ${V3_RUNTIME_PASSWORD:?V3_RUNTIME_PASSWORD を .env に書いてください}
      TZ: Asia/Tokyo
    volumes:
      - pgdata_rehearsal:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legalbridge"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 同期に使う認証情報を取る。Windows の gcloud が接続エラーで落ちる環境向けに、
  # トークンの引き換えをコンテナ側で行う（PC はブラウザを開く役だけ）。
  #   docker compose run --rm login
  login:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    profiles: ["ops"]
    environment:
      CLOUDSDK_CONFIG: /keys/gcloud
      CLOUDSDK_CORE_PROJECT: ${GCP_PROJECT:-legalbridge-488506}
    volumes:
      - ./bin/login.sh:/usr/local/bin/login:ro
      - ./keys:/keys
    entrypoint: ["bash", "/usr/local/bin/login"]

volumes:
  pgdata:
  pgdata_rehearsal:
